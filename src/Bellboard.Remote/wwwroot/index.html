<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0F13" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bellboard">
  <meta name="referrer" content="no-referrer">
  <title>Bellboard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot" id="boot" role="status">
      <img src="/icon.svg" alt="" width="56" height="56">
      <p>Connecting to Bellboard…</p>
    </div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Bellboard needs JavaScript to run.</p></noscript>
</body>
</html>
