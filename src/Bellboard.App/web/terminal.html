<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bellboard terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #15171c); }
    #term { position: absolute; inset: 10px 6px 6px 16px; }
    /* Bundled so "JetBrains Mono" works even where it isn't installed (SIL Open Font License, fonts/). */
    @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono-400.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono-700.ttf') format('truetype'); font-weight: 700; }
    .xterm .xterm-viewport::-webkit-scrollbar { width: 8px; background: transparent; }
    .xterm .xterm-viewport::-webkit-scrollbar-button { display: none; height: 0; }
    .xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb { background: #2a2f39; border-radius: 4px; }
    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #3a4150; }

    #find {
      position: absolute; top: 8px; right: 18px; z-index: 10;
      display: flex; align-items: center; gap: 2px; padding: 4px 4px 4px 10px;
      background: #1d2028; border: 1px solid #2e333e; border-radius: 9px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      font: 12.5px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; color: #d7dae0;
    }
    #find input {
      width: 200px; background: transparent; border: 0; outline: 0; color: #eef0f4; font: inherit; padding: 4px 0;
    }
    #find input::placeholder { color: #5a606b; }
    #find .count { min-width: 64px; text-align: right; color: #8a909b; font-variant-numeric: tabular-nums; padding-right: 4px; }
    #find .count.none { color: #f08a92; }
    #find button {
      width: 26px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #8a909b;
      font: 12px 'Segoe UI', sans-serif; cursor: pointer; display: grid; place-items: center;
    }
    #find button:hover { background: #2a2f39; color: #eef0f4; }
    #find button.on { background: #24324d; color: #8fb6ff; }
    #find .sep { width: 1px; height: 16px; background: #2e333e; margin: 0 3px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="term"></div>
  <div id="find" hidden role="search">
    <input id="find-q" type="text" placeholder="Find" spellcheck="false" aria-label="Find in terminal">
    <span id="find-count" class="count"></span>
    <button id="find-case" title="Match case (Alt+C)">Aa</button>
    <button id="find-word" title="Whole word (Alt+W)"><u>ab</u></button>
    <button id="find-regex" title="Regular expression (Alt+R)">.*</button>
    <span class="sep"></span>
    <button id="find-prev" title="Previous (Shift+Enter)">&#8593;</button>
    <button id="find-next" title="Next (Enter)">&#8595;</button>
    <button id="find-close" title="Close (Esc)">&#10005;</button>
  </div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="vendor/addon-unicode11.js"></script>
  <script src="vendor/addon-serialize.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
