name: release

# Push a tag like v0.4.0 to build, test and publish a GitHub release with the zip, its SHA-256,
# the update feed (latest.json, read by `bell update`) and the winget manifests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Unit tests
        run: dotnet test tests/Bellboard.Tests/Bellboard.Tests.csproj -c Release

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} doesn't match Directory.Build.props version $version" }

      - name: Package
        shell: pwsh
        run: ./build.ps1 -Package -Output dist/package/Bellboard

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "release-notes.md"
          $section = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$("${{ github.ref_name }}".TrimStart('v'))*" } | Select-Object -First 1
          ("## " + $section).Trim() | Set-Content $notes
          Compress-Archive -Path dist/package/winget/* -DestinationPath dist/package/winget-manifests.zip
          gh release create "${{ github.ref_name }}" --title "Bellboard ${{ github.ref_name }}" --notes-file $notes `
            (Get-ChildItem dist/package/*.zip).FullName (Get-ChildItem dist/package/*.sha256).FullName dist/package/latest.json
